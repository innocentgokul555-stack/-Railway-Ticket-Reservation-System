<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Railway Ticket Reservation System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ==================== LOGIN PAGE ==================== -->
  <div id="loginPage" class="page">
    <div class="login-card">
      <div class="logo">
        <span class="logo-icon">🚆</span>
        <h1>Railway Reservation</h1>
        <p class="subtitle">Login to book your tickets</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="icon">👤</span>
            <input type="text" id="username" placeholder="Enter username" required />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="icon">🔒</span>
            <input type="password" id="password" placeholder="Enter password" required />
          </div>
        </div>

        <p id="loginError" class="error-msg" hidden>Invalid username or password!</p>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <p class="hint">Enter any username &amp; password to login</p>
    </div>
  </div>

  <!-- ==================== RESERVATION PAGE ==================== -->
  <div id="reservationPage" class="page hidden">

    <!-- Top navbar -->
    <nav class="navbar">
      <div class="nav-brand">🚆 Railway Reservation</div>
      <div class="nav-right">
        <span id="welcomeUser"></span>
        <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </nav>

    <main class="container">
      <!-- Booking Form -->
      <section id="bookingSection" class="card">
        <h2>🎫 Book Your Ticket</h2>

        <form id="bookingForm">
          <div class="form-grid">
            <!-- Passenger Name -->
            <div class="input-group">
              <label for="passengerName">Passenger Name</label>
              <input type="text" id="passengerName" placeholder="Full name" required />
            </div>

            <!-- Age -->
            <div class="input-group">
              <label for="age">Age</label>
              <input type="number" id="age" min="1" max="120" placeholder="Age" required />
            </div>

            <!-- Gender -->
            <div class="input-group">
              <label for="gender">Gender</label>
              <select id="gender" required>
                <option value="">-- Select --</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>

            <!-- Phone -->
            <div class="input-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="10-digit number" pattern="[0-9]{10}" required />
            </div>

            <!-- From Station -->
            <div class="input-group">
              <label for="fromStation">From Station</label>
              <select id="fromStation" required>
                <option value="">-- Select --</option>
                <option>New Delhi</option>
                <option>Mumbai Central</option>
                <option>Chennai Central</option>
                <option>Kolkata (Howrah)</option>
                <option>Bangalore City</option>
                <option>Hyderabad (Secunderabad)</option>
                <option>Ahmedabad Junction</option>
                <option>Jaipur Junction</option>
                <option>Lucknow (Charbagh)</option>
                <option>Pune Junction</option>
              </select>
            </div>

            <!-- To Station -->
            <div class="input-group">
              <label for="toStation">To Station</label>
              <select id="toStation" required>
                <option value="">-- Select --</option>
                <option>New Delhi</option>
                <option>Mumbai Central</option>
                <option>Chennai Central</option>
                <option>Kolkata (Howrah)</option>
                <option>Bangalore City</option>
                <option>Hyderabad (Secunderabad)</option>
                <option>Ahmedabad Junction</option>
                <option>Jaipur Junction</option>
                <option>Lucknow (Charbagh)</option>
                <option>Pune Junction</option>
              </select>
            </div>

            <!-- Date of Journey -->
            <div class="input-group">
              <label for="journeyDate">Date of Journey</label>
              <input type="date" id="journeyDate" required />
            </div>

            <!-- Class -->
            <div class="input-group">
              <label for="travelClass">Travel Class</label>
              <select id="travelClass" required>
                <option value="">-- Select --</option>
                <option value="SL">Sleeper (SL) — ₹350</option>
                <option value="3A">AC 3-Tier (3A) — ₹850</option>
                <option value="2A">AC 2-Tier (2A) — ₹1250</option>
                <option value="1A">AC First Class (1A) — ₹2100</option>
              </select>
            </div>

            <!-- Number of Passengers -->
            <div class="input-group">
              <label for="numPassengers">No. of Passengers</label>
              <input type="number" id="numPassengers" min="1" max="6" value="1" required />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Book Ticket</button>
            <button type="reset" class="btn btn-outline">Reset</button>
          </div>
        </form>
      </section>

      <!-- Ticket Confirmation (hidden until booking) -->
      <section id="ticketSection" class="card hidden">
        <h2>✅ Booking Confirmed!</h2>
        <div id="ticketDetails" class="ticket"></div>
        <div class="form-actions">
          <button id="printBtn" class="btn btn-primary" onclick="window.print()">🖨️ Print Ticket</button>
          <button id="newBookingBtn" class="btn btn-outline">+ New Booking</button>
        </div>
      </section>

      <!-- Booking History -->
      <section id="historySection" class="card">
        <h2>📋 Booking History</h2>
        <div id="historyTableWrapper">
          <p class="empty-state">No bookings yet. Book your first ticket above!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
